<!DOCTYPE html>
<html lang="en">
 
<head>
    <title>GlueX detector calibration monitoring</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">  
    <script src="demon.js" type="module"></script>    
    
    <style>      
    body {margin:0 2rem 1rem 2rem;font-family:-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; font-size:1rem;font-weight:400;line-height:1.5;color:#212529;text-align:left;background-color:white}
    #page_top img {margin: 0 5px 10px 0; vertical-align:middle;}
    #page_info {font-size:0.9rem; margin-bottom:10px;}
    #header {position: sticky; top: 0; padding-top: 1rem; width: 1200px; background-color:white;}
    #header {z-index: 90;} /* higher than normal graphs but lower than jsroot_enlarged_div (z=100)*/
    #links span {margin-right: 0.5rem;}
    #selectors,#titles {margin-top: 1rem; margin-bottom: 1rem;}	
    #problems {margin-top: 0; margin-bottom: 0; font-size:1.5rem; color:#ff3131;}
      
    .graphpanel {width:1200px; height:420px; margin-top: 50px;}
    .statusgraphpanel {width:1200px; height:320px; margin-top: 50px;}
    .graph_top {margin-top:2.5rem; scroll-margin-top: 270px;}
    .graph_bottom {height:30px; padding-left:4px;}
    .before_mg_constituents {margin-top: 30px; height:30px; width:100%; padding:5px; background-color:#eff3f8;}
    .graph_bottom, .before_mg_constituents {font-style: italic; font-size: 80%; color:darkslategrey;}

    button, select { text-transform:none; margin: 0; font-family: inherit; font-size: inherit; line-height: inherit;}
    button.graph_url {width:25px; cursor:pointer; padding:0;}
    button.graph_url img {height: 10px; width: 22px; margin-bottom:2px;}
    button.graph_url {background-color:transparent; border:none;}
    
    .red {color:#ff3131;}    
    a {color: #007bff; text-decoration: none;}
    h2 {font-size: 2rem; font-weight:500; line-height: 1.2; margin:0;}
    hr {margin:0; border:0; border-top: 1px solid lightgrey;}
    img {vertical-align:text-bottom;}
	
    </style>
</head>


<body>

  <div id="header">
    <div id="page_top" class="red"><img src="demon.png" alt="demon" width="32" height="32">GlueX Demon is watching Hall D monitoring data. Contact Naomi Jarvis (njarvis) with any questions.
    </div>
    <div id="page_info">
      Status codes are 1 (good), 0 (bad) or -1 (unknown).<br>
      Use the JSROOT menu beneath the plot (grey square, bottom left) to make snapshots.
    </div>
    <div id="links">
        <span id="github"><a href="https://github.com/JeffersonLab/gluex_demon">Github repo</a></span>
        <span id="rootfile"><a id="link_root" href="">ROOT file</a></span>
        <span id="csv"><a id="link_csv" href="">CSV file</a></span>
        <span id="compare"><a id="link_compare" href="">Compare graphs</a></span>
    </div>


    <div id ="selectors">
        <select name="select_rp" id="select_rp">
	      <option value="Loading">Loading data</option>
        </select>

        <select name="select_ver" id="select_ver">
        </select>
        <button type="button" id="reload" style="display:none">Go</button>
        <select name="select_page" id="select_page">
        </select>

        <select name="select_graph" id="select_graph">
        </select>
    </div>

    <div id="problems">
    </div>

    <div id="titles">
        <h2><span id="RunPeriod"></span>&nbsp;&nbsp;<span id="Version"></span></h2>
    </div>
    <hr>
  </div>
  
  <div id="graphs"></div>

</body>

</html>
