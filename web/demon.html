<!DOCTYPE html>
<html lang="en">
 
<head>
    <title>GlueX detector calibration monitoring</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sidebars/">
    <link rel="icon" type="image/x-icon" href="favicon.ico">  
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"
        integrity="sha256-eTyxS0rkjpLEo16uXTS0uVCS4815lc40K2iVpWDvdSY=" crossorigin="anonymous"></script>
    <link href="https://gitcdn.github.io/bootstrap-toggle/2.2.2/css/bootstrap-toggle.min.css" rel="stylesheet">
    <script src="https://gitcdn.github.io/bootstrap-toggle/2.2.2/js/bootstrap-toggle.min.js"></script>

    <script src="demoncopy.js" type="module"></script>    
    
    <style>
        body {margin:1em 2em 1em 2em;}  
        #links span {margin-right: 0.5em;}
        #selectors,#titles {margin-top: 1em; margin-bottom: 1em;}
        #problems {margin-top: 0em; margin-bottom: 0em; font-size:1.5em; color:#ff3131;}
        #titles2 {margin-top: 1em; margin-bottom: 2em;}
        #top {margin-top:10px;}
        #top hr {border: 2px solid #505050;}
        .red {color:#ff3131;}
        .graphpanel {width:1200px; height:420px; margin-top: 50px;}
        .statusgraphpanel {width:1200px; height:320px; margin-top: 50px;}
        .graph_info {width:1200px; height:50px; margin-top: 10px;}	
        .graph_top {margin-top:2.5em;}
        .graph_bottom {font-size:80%; font-style:italic; color: darkslategray; height:30px; padding-left:4px;}
        .before_mg_constituents {margin-top: 30px; height:30px; width:100%; padding:5px; background-color:#eff3f8; font-size:80%; font-style:italic; color: darkslategray;}
        button.graph_url {width:25px; cursor:pointer; padding:0;}
        button.graph_url img {height: 10px; width: 22px;}
        button.graph_url:hover img {height:14px; width:24px;}
        button.graph_url {background-color:transparent; border:none;}
    </style>
</head>


<body>

    <div id="top" class="red"><img src="demon.png" alt="demon" width="32" height="32" style="margin: 0 5px 10px 0">GlueX Demon is watching Hall D monitoring data. Contact Naomi Jarvis (njarvis) with any questions.
    </div>
    <div id="links">
        <span id="github"><a href="https://github.com/JeffersonLab/gluex_demon">Github repo</a></span>
        <span id="rootfile"></span>
        <span id="csv"></span>
        <span id="compare"></span>
    </div>


    <div id ="selectors">
        <hr>
        <select name="select_rp" id="select_rp">
	      <option value="Loading">Loading data</option>
        </select>

        <select name="select_ver" id="select_ver">
        </select>
        <button type="button" id="reload" style="display:none">Go</button>
        <select name="select_det" id="select_det">
        </select>

        <select name="select_graph" id="select_graph">
        </select>

        <hr>
    </div>

    <div id="problems">
    </div>

    <div id="titles">
        <h1><span id="RunPeriod"></span>&nbsp;&nbsp;<span id="Version"></span>&nbsp;&nbsp;<span id="Detector"></span></h1><br>
    </div>

    <div id="titles2">
        <div id="statuscodes">
        Status codes are 1 (good), 0 (bad) or -1 (unknown)
        <br>
        </div>
        <span id="return"></span><br>
    </div>

    <div id="graphs">
    </div>

</body>

</html>
